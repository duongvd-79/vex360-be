spring:
  application:
    name: vex360
  config:
    import: optional:file:.env[.properties],optional:file:vex360-be/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA Config
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: false
    baseline-on-migrate: true

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 62MB

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Custom Application Settings
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5175}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    orphan-cleanup:
      enabled: ${CLOUDINARY_ORPHAN_CLEANUP_ENABLED:false}
      cron: ${CLOUDINARY_ORPHAN_CLEANUP_CRON:0 30 2 * * *}
      grace-period: ${CLOUDINARY_ORPHAN_CLEANUP_GRACE_PERIOD:PT24H}
      page-size: ${CLOUDINARY_ORPHAN_CLEANUP_PAGE_SIZE:100}
      max-scanned-per-run: ${CLOUDINARY_ORPHAN_CLEANUP_MAX_SCANNED:1000}
      max-deletions-per-run: ${CLOUDINARY_ORPHAN_CLEANUP_MAX_DELETIONS:100}

  wallet:
    encryption:
      active-version: ${WALLET_ENCRYPTION_ACTIVE_VERSION:1}
      keys:
        1: ${WALLET_ENCRYPTION_KEY_V1:k3Yv1RjOU46XoH7jYyq9N3v8Z1xW4pQ7sM0lK2jH8gF=}

  # JWT Settings
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
    remember-refresh-expiration-ms: ${JWT_REMEMBER_REFRESH_EXPIRATION_MS:2592000000}

  # Security Whitelist
  security:
    oauth2:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}

      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5175/auth/callback/google}
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

    whitelist: /api/v1/auth/**,/api/v1/partnership-requests/guest,/api/v1/partnership-requests/verify,/api/v1/package-templates/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/api/v1/webhooks/payos/**,/api/v1/public/exhibitions/**, /ws/**,/actuator/**
    strict-mode: ${SECURITY_STRICT_MODE:true}
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}

  # Reset Password Configuration
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  reset-password:
    frontend-url: ${RESET_PASSWORD_FRONTEND_URL:http://localhost:5175/reset-password}
  registration:
    frontend-url: ${REGISTRATION_FRONTEND_URL:http://localhost:5175/login}
  partnership:
    frontend-url: ${PARTNERSHIP_FRONTEND_URL:http://localhost:5175/partnership/verified}

  # Database Seeder
  seed:
    enabled: ${APP_SEED_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:vex360}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${LOCAL_DB_USER:root}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  payos:
    # Local development can boot without real PayOS credentials. Production
    # remains strict in the aiven profile and in PayOSConfig.
    client-id: ${LOCAL_PAYOS_CLIENT_ID:mock_local_client_id}
    api-key: ${LOCAL_PAYOS_API_KEY:mock_local_api_key}
    checksum-key: ${LOCAL_PAYOS_CHECKSUM_KEY:mock_local_checksum_key}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5175/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5175/payment/cancel}
    storage-return-url: ${PAYOS_STORAGE_RETURN_URL:http://localhost:5175/storage/payment/success}
    storage-cancel-url: ${PAYOS_STORAGE_CANCEL_URL:http://localhost:5175/storage/payment/cancel}
---
spring:
  config:
    activate:
      on-profile: aiven
  datasource:
    url: jdbc:mysql://${AIVEN_DB_HOST}:${AIVEN_DB_PORT}/${AIVEN_DB_NAME}?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true
    username: ${AIVEN_DB_USER}
    password: ${AIVEN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 900000
app:
  mail:
    gmail:
      client-id: ${GMAIL_CLIENT_ID}
      client-secret: ${GMAIL_CLIENT_SECRET}
      refresh-token: ${GMAIL_REFRESH_TOKEN}
      user-email: ${GMAIL_USER_EMAIL}
    resend:
      api-key: ${RESEND_API_KEY}
      from: ${RESEND_FROM}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://vex360.vercel.app}
  security:
    oauth2:
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://vex360.vercel.app/auth/callback/google}
  backend:
    base-url: ${BACKEND_BASE_URL:https://vex360.vercel.app}
  reset-password:
    frontend-url: ${RESET_PASSWORD_FRONTEND_URL:https://vex360.vercel.app/reset-password}
  registration:
    frontend-url: ${REGISTRATION_FRONTEND_URL:https://vex360.vercel.app/login}
  partnership:
    frontend-url: ${PARTNERSHIP_FRONTEND_URL:https://vex360.vercel.app/partnership/verified}
  payos:
    client-id: ${DEPLOY_PAYOS_CLIENT_ID}
    api-key: ${DEPLOY_PAYOS_API_KEY}
    checksum-key: ${DEPLOY_PAYOS_CHECKSUM_KEY}
    return-url: ${PAYOS_RETURN_URL:https://vex360.vercel.app/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:https://vex360.vercel.app/payment/cancel}
    storage-return-url: ${PAYOS_STORAGE_RETURN_URL:https://vex360.vercel.app/storage/payment/success}
    storage-cancel-url: ${PAYOS_STORAGE_CANCEL_URL:https://vex360.vercel.app/storage/payment/cancel}
